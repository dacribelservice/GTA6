<body>
  <!-- 🏢 EL EDIFICIO PRINCIPAL (Contenedor Inquebrantable) -->

    <div id="escenario-mapa">
      <div id="lienzo-mapa">
        <div id="capa-terreno"></div>
      </div>
      <!-- Capas en escala nativa 1:1 de pantalla (fuera del scale() de #lienzo-mapa) -->

      <div id="capa-iconos" aria-live="polite"></div>
      <div id="capa-pines" aria-live="polite"></div>
    </div>

    <!-- Controles del Edificio (Zoom y Vistas: Radar / Atlas / Satélite) -->
    <nav id="controles-edificio" aria-label="Controles del mapa"></nav>

    <!-- Espacios de conexión para los Locales #2, #3, #4 y #6 -->
    <aside id="local-menu-filtros"></aside>
    <section id="local-tarjeta-info" aria-live="polite"></section>
    <section id="local-progreso-jugador"></section>
    <section id="local-modo-editor"></section>
  </main>
  <script type="module" src="edificio/central-locales.js"></script>
